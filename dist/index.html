<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compteur - Essai Dérivé</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            text-align: center;
            background: white;
            width: min(100%, 420px);
            padding: 32px 24px;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #333;
            margin: 0 0 12px;
            font-size: clamp(1.8rem, 5vw, 2.5rem);
        }

        p {
            color: #666;
            margin: 0;
            line-height: 1.5;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 16px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 999px;
            background: #667eea;
            color: white;
            cursor: pointer;
            touch-action: manipulation;
        }

        button:hover {
            background: #764ba2;
        }

        button:focus-visible {
            outline: 3px solid rgba(102, 126, 234, 0.35);
            outline-offset: 3px;
        }

        .hint {
            margin-top: 16px;
            color: #333;
            font-weight: bold;
        }

        @media (max-width: 480px) {
            body {
                align-items: stretch;
            }

            .container {
                margin: auto 0;
                padding: 28px 20px;
            }

            button {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>👋 Bonjour&nbsp;!</h1>
        <p>Le compteur est bien là, visible et utilisable sur mobile.</p>
        <button id="counter-btn" type="button" aria-live="polite" aria-label="Compteur 0">
            Compteur&nbsp;: 0
        </button>
        <p class="hint">Touchez le bouton pour incrémenter le compteur.</p>
    </main>
    <script>
        const button = document.getElementById('counter-btn');
        let count = 0;

        button?.addEventListener('click', () => {
            count += 1;
            const label = `Compteur : ${count}`;
            button.textContent = label;
            button.setAttribute('aria-label', label);
        });
    </script>
</body>
</html>
